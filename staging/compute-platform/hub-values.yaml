      if os.environ.get("CPS_COMPUTE_ENABLED", "0") == "1":
          import json
          from cps_compute.hub import configure_hub
          with open(os.environ["CPS_COMPUTE_CONFIG"], encoding="utf-8") as source:
              configure_hub(c, json.load(source))

# SOPS Configuration
# This file configures SOPS for secret encryption in this repository

# Age key configuration
creation_rules:
  # Encrypt SopsSecret CRs in sopssecrets directories (new format)
  # Only encrypt the stringData values within spec.secretTemplates
  - path_regex: bundles/.*/secrets/sopssecrets/.*\.yaml$
    encrypted_regex: "^(stringData)$"
    age: age1u7wrq6yktkprvkce38vhz358fmx7gunkyd0aflvu84d3wtvrrd7qvqwe26

  # Legacy: Encrypt all files in sops directories (old format - to be migrated)
  - path_regex: .*\.enc\.yaml$
    age: age1u7wrq6yktkprvkce38vhz358fmx7gunkyd0aflvu84d3wtvrrd7qvqwe26

# Alternative: Use multiple keys for different environments
# creation_rules:

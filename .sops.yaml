# SOPS Configuration
# This file configures SOPS for secret encryption in this repository

# Age key configuration
creation_rules:
  # Encrypt SopsSecret CRs (new format)
  # Only encrypt the stringData values within spec.secretTemplates
  - path_regex: bundles/.*-sopssecret\.yaml$
    encrypted_regex: "^(stringData)$"
    age: age1h05qj66un22scwapuhyl76skls7ll235vlu27cjwkk5tpav6sqmsx3zp6a

  # Legacy: Encrypt all files in sops directories (old format - to be migrated)
  - path_regex: .*\.enc\.yaml$
    age: age1h05qj66un22scwapuhyl76skls7ll235vlu27cjwkk5tpav6sqmsx3zp6a

# Alternative: Use multiple keys for different environments
# creation_rules:
#   - path_regex: bundles/.*/secrets/sops/.*\.enc\.yaml$
#     age: >-
#       age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx,
#       age1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy


# Fleet bundle configuration for PostgreSQL
# Bundle name: cit-postgres
name: cit-postgres

defaultNamespace: cit-postgres

helm:
  repo: https://charts.bitnami.com/bitnami
  chart: postgresql
  version: 18.2.3 #15.2.5
  releaseName: postgresql
  valuesFiles:
    - values/values.yaml

# Include SOPS secret manifests
diff:
  compareSecrets: false

bundleStructureMode: "all"
dependsOn:
  - name: cit-crds
  - name: cit-sops-operator

# Target cluster selection
targets:
  - name: cit-clusters
    clusterSelector:
      matchLabels:
        env: cit-teaching

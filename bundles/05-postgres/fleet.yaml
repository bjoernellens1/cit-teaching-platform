# Fleet bundle configuration for PostgreSQL
# Bundle name: cit-postgres
name: cit-postgres

defaultNamespace: cit-postgres

helm:
  repo: https://charts.bitnami.com/bitnami
  chart: postgresql
  version: 15.2.5
  releaseName: postgresql
  valuesFiles:
    - values/values.yaml

# Depends on CRDs and SOPS operator for secret decryption
dependsOn:
  - name: cit-crds
  - name: cit-sops-operator

# Target cluster selection
targets:
  - name: cit-clusters
    clusterSelector:
      matchLabels:
        env: cit-teaching

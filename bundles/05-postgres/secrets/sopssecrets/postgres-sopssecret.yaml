# SopsSecret for shared PostgreSQL credentials
# This wraps the encrypted secret and will be decrypted by the SOPS operator
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: postgres-credentials-sopssecret
  namespace: cit-postgres
spec:
  secretTemplates:
    - name: postgres-credentials
      type: Opaque
      stringData:
        # Admin password for PostgreSQL
        postgres-password: "PLACEHOLDER_REENCRYPT"
        # User password for PostgreSQL
        password: "PLACEHOLDER_REENCRYPT"

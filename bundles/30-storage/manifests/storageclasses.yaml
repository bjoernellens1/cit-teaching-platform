# Storage Classes for CIT Teaching Platform
#
# This file defines storage classes used by the platform.
# Adjust based on your cluster's storage capabilities.

# =============================================================================
# NFS-CSI Storage Class (for RWX volumes)
# =============================================================================
# Uncomment and configure if using NFS-CSI driver
#
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: nfs-csi
# provisioner: nfs.csi.k8s.io
# parameters:
#   server: nfs-server.example.com
#   share: /export/cit-teaching
# reclaimPolicy: Retain
# volumeBindingMode: Immediate
# mountOptions:
#   - nfsvers=4.1

---
# =============================================================================
# Longhorn RWX Storage Class (alternative)
# =============================================================================
# Uncomment if using Longhorn
#
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: longhorn-rwx
# provisioner: driver.longhorn.io
# allowVolumeExpansion: true
# reclaimPolicy: Retain
# volumeBindingMode: Immediate
# parameters:
#   numberOfReplicas: "2"
#   staleReplicaTimeout: "2880"
#   fromBackup: ""
#   fsType: ext4
#   # RWX requires NFSv4
#   nfsOptions: "vers=4.1,noresvport,soft,timeo=600,retrans=5"

# SopsSecret for Authentik application secrets
# This wraps the encrypted secrets and will be decrypted by the SOPS operator
# Note: Redis removed in Authentik 2025.10 (https://docs.goauthentik.io/releases/2025.10)
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: authentik-sopssecret
  namespace: cit-auth
spec:
  secretTemplates:
    # Main Authentik secrets (referenced by envFrom in helm values)
    - name: authentik-secrets
      type: Opaque
      stringData:
        AUTHENTIK_SECRET_KEY: "PLACEHOLDER_REENCRYPT"
        AUTHENTIK_KEYCLOAK_CLIENT_SECRET: "PLACEHOLDER_REENCRYPT"
        AUTHENTIK_BOOTSTRAP_TOKEN: "PLACEHOLDER_REENCRYPT"

    # PostgreSQL credentials for Authentik
    - name: authentik-postgres-credentials
      type: Opaque
      stringData:
        postgres-password: "PLACEHOLDER_REENCRYPT"
        password: "PLACEHOLDER_REENCRYPT"

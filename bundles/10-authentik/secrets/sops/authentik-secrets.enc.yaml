# Authentik Secrets - SOPS Encrypted Template
# 
# This file should be encrypted with SOPS before committing.
# 
# To encrypt:
#   sops --encrypt --age <age-public-key> authentik-secrets.enc.yaml
# 
# To edit:
#   sops authentik-secrets.enc.yaml
#
# Required secrets:
# - authentik.secret_key: Random 50+ character string for signing
# - keycloak.client_secret: OIDC client secret from Uni Keycloak

apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: cit-auth
type: Opaque
stringData:
  # Authentik secret key for signing cookies/tokens
  # Generate with: openssl rand -base64 50
  secret-key: "REPLACE_WITH_RANDOM_SECRET_KEY"
  
  # Uni Keycloak OIDC client secret
  # Obtain from Uni Keycloak admin for the CIT Authentik client
  keycloak-client-secret: "REPLACE_WITH_KEYCLOAK_CLIENT_SECRET"
  
  # Bootstrap token for initial admin access (optional)
  # Generate with: openssl rand -hex 32
  bootstrap-token: "REPLACE_WITH_BOOTSTRAP_TOKEN"

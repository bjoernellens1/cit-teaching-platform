# PostgreSQL Secrets - SOPS Encrypted Template
#
# This file should be encrypted with SOPS before committing.
#
# To encrypt:
#   sops --encrypt --age <age-public-key> postgres-secrets.enc.yaml
#
# To edit:
#   sops postgres-secrets.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: authentik-postgres-credentials
  namespace: cit-auth
type: Opaque
stringData:
  # PostgreSQL admin password
  # Generate with: openssl rand -base64 32
  postgres-password: "REPLACE_WITH_POSTGRES_ADMIN_PASSWORD"
  
  # Authentik database user password
  # Generate with: openssl rand -base64 32
  password: "REPLACE_WITH_AUTHENTIK_DB_PASSWORD"

# Fleet bundle configuration for Authentik
# Bundle name: cit-authentik
name: cit-authentik

defaultNamespace: cit-auth

helm:
  repo: https://charts.goauthentik.io
  chart: authentik
  version: ^2026.0.0
  releaseName: authentik
  valuesFiles:
    - values/authentik-values.yaml
  values:
    global:
      postgresql:
        auth:
          password: "dummy-password-for-helm-validation"

# Include SOPS secret manifests
resources:
  - path: authentik-sopssecret.yaml
dependsOn:
  - name: cit-crds
  - name: cit-sops-operator

# Target cluster selection
targets:
  - name: cit-clusters
    clusterSelector:
      matchLabels:
        env: cit-teaching

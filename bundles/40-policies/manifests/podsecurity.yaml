# Pod Security Standards for CIT Teaching Platform
#
# These policies enforce security best practices for pods in the platform.
# Uses Kubernetes Pod Security Standards (PSS) via namespace labels.

# =============================================================================
# NAMESPACE LABELS FOR POD SECURITY STANDARDS
# =============================================================================

# ---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: cit-auth
#   labels:
#     app.kubernetes.io/part-of: cit-teaching-platform
#     app.kubernetes.io/component: authentication
#     # Pod Security Standards
#     pod-security.kubernetes.io/enforce: restricted
#     pod-security.kubernetes.io/enforce-version: latest
#     pod-security.kubernetes.io/audit: restricted
#     pod-security.kubernetes.io/audit-version: latest
#     pod-security.kubernetes.io/warn: restricted
#     pod-security.kubernetes.io/warn-version: latest

# ---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: cit-jhub
#   labels:
#     app.kubernetes.io/part-of: cit-teaching-platform
#     app.kubernetes.io/component: jupyterhub
#     # Pod Security Standards - baseline for user notebooks
#     # Notebooks need some flexibility (e.g., running as non-root but specific UID)
#     pod-security.kubernetes.io/enforce: baseline
#     pod-security.kubernetes.io/enforce-version: latest
#     pod-security.kubernetes.io/audit: restricted
#     pod-security.kubernetes.io/audit-version: latest
#     pod-security.kubernetes.io/warn: restricted
#     pod-security.kubernetes.io/warn-version: latest

# =============================================================================
# ADDITIONAL SECURITY CONTEXTS
# =============================================================================
# Note: Specific security contexts are set in the Helm values for each component.
# The following are recommendations:
#
# Authentik:
# - runAsNonRoot: true
# - allowPrivilegeEscalation: false
# - readOnlyRootFilesystem: true (where possible)
#
# JupyterHub:
# - Hub: runAsNonRoot: true
# - User pods: runAsUser: 1000 (jovyan), runAsGroup: 100
# - No privileged containers
# - Limited capabilities

# =============================================================================
# SECURITY POLICY FOR SERVICE ACCOUNTS
# =============================================================================


# Fleet bundle configuration for CRDs
# This bundle deploys cert-manager CRDs if not managed cluster-wide elsewhere

namespace: cert-manager

helm:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: 1.14.4
  releaseName: cert-manager
  # Only install CRDs from this bundle
  values:
    installCRDs: true

# Deploy CRDs before other bundles
dependsOn: []

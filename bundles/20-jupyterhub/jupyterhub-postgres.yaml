# PostgreSQL for JupyterHub
# Sized for 300 concurrent users
# Deployed in cit-jhub namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-postgresql-config
  namespace: cit-jhub
data:
  # PostgreSQL configuration tuned for JupyterHub hub metadata
  # max_connections: 200 (sufficient for hub + spawner connections)
  # shared_buffers: 256MB (small dataset - hub state only)
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 512MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    wal_buffers = 8MB
    checkpoint_completion_target = 0.9
    random_page_cost = 1.1
    effective_io_concurrency = 200
    min_wal_size = 80MB
    max_wal_size = 1GB
    log_timezone = 'UTC'
    datestyle = 'iso, mdy'
    timezone = 'UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    default_text_search_config = 'pg_catalog.english'
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub-postgresql
  namespace: cit-jhub
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: jupyterhub
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: jupyterhub
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jupyterhub-postgresql
  namespace: cit-jhub
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: jupyterhub
    app.kubernetes.io/component: database
spec:
  replicas: 1
  serviceName: jupyterhub-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: jupyterhub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: jupyterhub
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: postgresql
          image: docker.io/bitnami/postgresql:16.6.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: POSTGRESQL_PORT_NUMBER
              value: "5432"
            - name: POSTGRESQL_VOLUME_DIR
              value: "/bitnami/postgresql"
            - name: PGDATA
              value: "/bitnami/postgresql/data"
            - name: POSTGRES_USER
              value: "jupyterhub"
            - name: POSTGRES_DB
              value: "jupyterhub"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-postgres-credentials
                  key: password
            - name: POSTGRES_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-postgres-credentials
                  key: postgres-password
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "jupyterhub" -d "dbname=jupyterhub" -h 127.0.0.1 -p 5432
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "jupyterhub" -d "dbname=jupyterhub" -h 127.0.0.1 -p 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
            - name: config
              mountPath: /opt/bitnami/postgresql/conf/conf.d/
      volumes:
        - name: config
          configMap:
            name: jupyterhub-postgresql-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

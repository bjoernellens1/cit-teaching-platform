# JupyterHub Secrets - SOPS Encrypted Template
#
# This file should be encrypted with SOPS before committing.
#
# To encrypt:
#   sops --encrypt --age <age-public-key> jupyterhub-secrets.enc.yaml
#
# To edit:
#   sops jupyterhub-secrets.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-oauth-secret
  namespace: cit-jhub
type: Opaque
stringData:
  # OAuth client secret from Authentik
  # Create an OAuth2 Provider in Authentik for JupyterHub
  # and copy the client secret here
  client-secret: "REPLACE_WITH_AUTHENTIK_OAUTH_CLIENT_SECRET"

---
apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-hub-secret
  namespace: cit-jhub
type: Opaque
stringData:
  # JupyterHub cookie secret
  # Generate with: openssl rand -hex 32
  cookie-secret: "REPLACE_WITH_COOKIE_SECRET"
  
  # JupyterHub API token for admin operations
  # Generate with: openssl rand -hex 32
  api-token: "REPLACE_WITH_API_TOKEN"

# SopsSecret for JupyterHub secrets
# This wraps the encrypted secrets and will be decrypted by the SOPS operator
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: jupyterhub-sopssecret
  namespace: cit-jhub
spec:
  secretTemplates:
    # OIDC client secret for authentication
    - name: jupyterhub-oidc-secret
      type: Opaque
      stringData:
        client-secret: "PLACEHOLDER_REENCRYPT"

    # Hub configuration secrets
    - name: jupyterhub-hub-secrets
      type: Opaque
      stringData:
        hub.cookie_secret: "PLACEHOLDER_REENCRYPT"
        proxy.secret_token: "PLACEHOLDER_REENCRYPT"
        crypt-key: "PLACEHOLDER_REENCRYPT"
        auth.state.crypto_key: "PLACEHOLDER_REENCRYPT"

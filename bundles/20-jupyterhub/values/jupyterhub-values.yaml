          "mps-log": {"name": "mps-log", "hostPath": {"path": "/run/nvidia/mps/nvidia.com/gpu/log", "type": "DirectoryOrCreate"}},
      }
      _mps_volume_mounts = {
          "mps-pipe": {"name": "mps-pipe", "mountPath": "/mps/nvidia.com/gpu/pipe"},
          "mps-log": {"name": "mps-log", "mountPath": "/mps/nvidia.com/gpu/log"},

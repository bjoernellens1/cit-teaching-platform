# JupyterHub Helm values for CIT Teaching Platform
# Using Zero-to-JupyterHub (z2jh) chart
# Optimized for teaching workloads with course-based access control

# =============================================================================
# HUB CONFIGURATION
# =============================================================================

hub:
  # Resource limits for hub
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  # Database configuration - PostgreSQL for 300 users
  # Password provided via PGPASSWORD environment variable in extraEnv
  db:
    type: postgres
    url: "postgresql+psycopg2://jupyterhub@jupyterhub-postgresql:5432/jupyterhub"
  
  existingSecret: jupyterhub-secrets
  
  # ==========================================================================
  # AUTHENTICATION - Dex OIDC broker (2026-07-24)
  #
  # Cut over from direct CIT Authentik OIDC to the shared Dex broker
  # (dex.dshl.unileoben.ac.at, deployed in the cps-gpu-cluster repo's
  # system/auth/dex bundle) so CPS and CIT Authentik users can both log in
  # here via one issuer, matching the pattern already validated and merged
  # for the cps-gpu-cluster repo's own JupyterHub instance. Dex's `cps`/
  # `cit` connectors already have insecureEnableGroups: true set (required
  # for GenericOAuthenticator's manage_groups/admin_groups to see any
  # groups at all -- see cps-gpu-cluster docs/dex-idp-broker.md for the
  # full incident writeup) and reuse the SAME preferred_username claim, so
  # username_claim below is UNCHANGED and existing users' claim-<username>
  # PVCs will be reused, not recreated.
  #
  # Rollback: restore the block below to:
  #   authorize_url: https://auth.dshl.unileoben.ac.at/application/o/authorize/
  #   token_url: https://auth.dshl.unileoben.ac.at/application/o/token/
  #   userdata_url: https://auth.dshl.unileoben.ac.at/application/o/userinfo/
  #   client_id: 2iyGeaF0ysvTadhCopxadMp99J65hfxiS79bniI6
  #   login_service: Authentik
  # and restore jupyterhub-oauth-secret's client-secret to the CIT
  # Authentik "Provider for cit-jhub" (pk 2) client secret.
  # ==========================================================================
  config:
    JupyterHub:
      authenticator_class: generic-oauth

    GenericOAuthenticator:
      # Dex broker endpoints (was direct CIT Authentik OIDC)
      authorize_url: https://dex.dshl.unileoben.ac.at/auth
      token_url: https://dex.dshl.unileoben.ac.at/token
      userdata_url: https://dex.dshl.unileoben.ac.at/userinfo

      # OAuth2 client credentials (Dex staticClient "cit-jupyterhub")
      client_id: cit-jupyterhub
      login_service: "Login (CPS or CIT via Dex)"
      # client_secret provided via extraEnv from secret
      
      # Scopes to request
      scope:
        - openid
        - profile
        - email
        - groups
      
      # User info mapping
      username_claim: preferred_username
      
      # Enable auth_state to access groups in spawner
      enable_auth_state: true
      
      # Enable group management to use admin_groups
      manage_groups: true
      # Admin group mapping
      admin_groups:
        - jhub-admins
      
      # Allow all authenticated users
      allow_all: true
    
    Authenticator:
      # Enable auth_state for group-based configuration
      enable_auth_state: true
      # Auto-login (skip JupyterHub login button)
      auto_login: true
  
  # ==========================================================================
  # EXTRA CONFIGURATION - Pre-spawn hook for course folders
  # ==========================================================================
  extraConfig:
    # Pre-spawn hook to create user directories and configure storage
    pre_spawn_hook: |
      import os
      
      async def pre_spawn_hook(spawner):
          """
          Pre-spawn hook to configure user environment based on group membership.
          
          Storage layout:
          - /home/jovyan (persistent, per-user Longhorn volume)
          - /home/jovyan/temp (ephemeral, fast emptyDir - cleared on pod restart)
          - /home/jovyan/shared (persistent, Longhorn RWX - only for admins/powerusers)
          - /home/jovyan/courses/<course_id> (persistent, per-course Longhorn RWX)
          
          Groups:
          - jhub-students: No shared storage, only home + temp + course folders
          - jhub-admins/jhub-powerusers: Full access including global shared folder
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))
          
          # Groups that get access to shared storage
          privileged_groups = {"jhub-admins", "jhub-powerusers"}
          is_privileged = bool(groups & privileged_groups)
          
          # Always create work directory (temp is created automatically by emptyDir mount)
          init_dirs = ["/home/jovyan/work"]
          
          # Initialize volumes and mounts lists for conditional mounts only
          # (temp volume is defined statically in values.yaml)
          volumes = []
          volume_mounts = []
          
          # Only mount shared storage for privileged users (not students)
          if is_privileged:
              init_dirs.append("/home/jovyan/shared")
              volumes.append({
                  "name": "global-shared",
                  "persistentVolumeClaim": {
                      "claimName": "jupyterhub-shared"
                  }
              })
              volume_mounts.append({
                  "name": "global-shared",
                  "mountPath": "/home/jovyan/shared",
                  "readOnly": False
              })
              spawner.log.info(f"User {spawner.user.name} is privileged, mounting shared storage")
          else:
              spawner.log.info(f"User {spawner.user.name} is student, no shared storage")
          
          # Identify course groups and prepare mounts
          course_ids = []
          for g in groups:
              if g.startswith("course-"):
                  course_id = g.replace("course-", "")
                  course_ids.append(course_id)
                  
                  # Add user-local course directory
                  init_dirs.append(f"/home/jovyan/courses/{course_id}")
                  
                  # Mount shared course volume (if exists)
                  volumes.append({
                      "name": f"course-{course_id}-shared",
                      "persistentVolumeClaim": {
                          "claimName": f"course-{course_id}-shared"
                      }
                  })
                  volume_mounts.append({
                      "name": f"course-{course_id}-shared",
                      "mountPath": f"/srv/courses/{course_id}",
                      "readOnly": False
                  })
          
          # Set environment for postStart hook
          spawner.environment["INIT_DIRS"] = " ".join(init_dirs)
          
          # Add conditional volumes (shared, courses) by appending to spawner lists
          if volumes:
              # Get raw current values
              raw_volumes = list(getattr(spawner, 'volumes', []) or [])
              raw_mounts = list(getattr(spawner, 'volume_mounts', []) or [])
              
              # Sanitize: retain only valid dicts, discard strings/others that cause crashes
              current_volumes = [v for v in raw_volumes if isinstance(v, dict)]
              current_mounts = [m for m in raw_mounts if isinstance(m, dict)]
              
              # Ensure temp-storage is present (fixing issue where it appears as string)
              if not any(v.get('name') == 'temp-storage' for v in current_volumes):
                  current_volumes.append({
                      "name": "temp-storage",
                      "emptyDir": {"sizeLimit": "10Gi"}
                  })
              
              if not any(m.get('name') == 'temp-storage' for m in current_mounts):
                  current_mounts.append({
                      "name": "temp-storage",
                      "mountPath": "/home/jovyan/temp"
                  })

              # Ensure home volume is present (fixing issue where it appears as string 'volume-{user_server}')
              # This ensures persistence for /home/jovyan
              home_mount_path = "/home/jovyan"
              if not any(m.get('mountPath') == home_mount_path for m in current_mounts):
                  # Define home volume name and claim name
                  # Using typical Z2JH naming convention
                  vol_name = f"volume-{spawner.user.name}"
                  claim_name = f"claim-{spawner.user.name}"
                  
                  current_volumes.append({
                      "name": vol_name,
                      "persistentVolumeClaim": {
                          "claimName": claim_name
                      }
                  })
                  current_mounts.append({
                      "name": vol_name,
                      "mountPath": home_mount_path
                  })
                  spawner.log.info(f"Reinstated home volume: {vol_name} -> {claim_name}")

              # Append new volumes and reassign
              spawner.volumes = current_volumes + volumes
              spawner.volume_mounts = current_mounts + volume_mounts
              
              spawner.log.info(f"Sanitized volumes and added privileged storage: {[v.get('name') for v in volumes]}")
          
          # Log for debugging
          spawner.log.info(f"User {spawner.user.name} groups: {groups}, courses: {course_ids}, privileged: {is_privileged}")
      
      c.KubeSpawner.pre_spawn_hook = pre_spawn_hook
    
    # Profile list hook for group-based profile filtering
    profile_list_hook: |
      # Store the original profile list before overwriting with the hook
      # MPS pipe/log mounts required for any profile that sets a gpu-memory
      # annotation (MPS-shared tier) -- without these, CUDA_MPS_PINNED_DEVICE_MEM_LIMIT
      # is silently unenforced (confirmed live on the cit-cps-gpu cluster,
      # 2026-07-06: a test pod without this wiring allocated 16x its
      # configured limit with zero errors). Paths match the cluster's real
      # MPS control daemon mounts (hostPath /run/nvidia/mps -> container /mps).
      _mps_volumes = [
          {"name": "mps-pipe", "hostPath": {"path": "/run/nvidia/mps/nvidia.com/gpu/pipe", "type": "DirectoryOrCreate"}},
          {"name": "mps-log", "hostPath": {"path": "/run/nvidia/mps/nvidia.com/gpu/log", "type": "DirectoryOrCreate"}},
      ]
      _mps_volume_mounts = [
          {"name": "mps-pipe", "mountPath": "/mps/nvidia.com/gpu/pipe"},
          {"name": "mps-log", "mountPath": "/mps/nvidia.com/gpu/log"},
      ]

      # Store the original profile list before overwriting with the hook
      _original_profile_list = [
          {
              "display_name": "CPU Small",
              "slug": "cpu-small",
              "description": "2 CPU cores, 6 GB RAM, 10 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 2,
                  "cpu_guarantee": 0.5,
                  "mem_limit": "6G",
                  "mem_guarantee": "1G",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-standard-cpu",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "courses"},
                  "priority_class_name": "kai-course-high"
              }
          },
          {
              "display_name": "CPU Large",
              "slug": "cpu-large",
              "description": "12 CPU cores, 24 GB RAM, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 12,
                  "cpu_guarantee": 2,
                  "mem_limit": "24G",
                  "mem_guarantee": "4G",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-standard-cpu",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
          {
              "display_name": "CPU XLarge",
              "slug": "cpu-xlarge",
              "description": "48 CPU cores, 128 GB RAM, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 48,
                  "cpu_guarantee": 8,
                  "mem_limit": "128G",
                  "mem_guarantee": "16G",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-standard-cpu",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
          {
              "display_name": "GPU XSmall - PyTorch",
              "slug": "gpu-xsmall-pytorch",
              "description": "16 CPU cores, 48 GiB RAM, 2 GB VRAM via MPS sharing, PyTorch, 24 GB storage",
              "default": True,
              "kubespawner_override": {
                "cpu_limit": 16,
                "cpu_guarantee": 4,
                "mem_limit": "48G",
                "mem_guarantee": "8G",
                "storage_capacity": "24Gi",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-pytorch-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "courses"},
                  "priority_class_name": "kai-course-high",
                  "extra_annotations": {"gpu-memory": "2048"},
                  "environment": {
                      "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT": "0=2048M",
                      "CUDA_MPS_PIPE_DIRECTORY": "/mps/nvidia.com/gpu/pipe",
                      "CUDA_MPS_LOG_DIRECTORY": "/mps/nvidia.com/gpu/log"
                  },
                  "volumes": _mps_volumes,
                  "volume_mounts": _mps_volume_mounts
              }
          },
          {
              "display_name": "GPU XSmall - TensorFlow",
              "slug": "gpu-xsmall-tf",
              "description": "16 CPU cores, 48 GiB RAM, 2 GB VRAM via MPS sharing, TensorFlow, 24 GB storage",
              "kubespawner_override": {
                "cpu_limit": 16,
                "cpu_guarantee": 4,
                "mem_limit": "48G",
                "mem_guarantee": "8G",
                "storage_capacity": "24Gi",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-tf-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "courses"},
                  "priority_class_name": "kai-course-high",
                  "extra_annotations": {"gpu-memory": "2048"},
                  "environment": {
                      "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT": "0=2048M",
                      "CUDA_MPS_PIPE_DIRECTORY": "/mps/nvidia.com/gpu/pipe",
                      "CUDA_MPS_LOG_DIRECTORY": "/mps/nvidia.com/gpu/log"
                  },
                  "volumes": _mps_volumes,
                  "volume_mounts": _mps_volume_mounts
              }
          },
          {
              "display_name": "GPU Small - PyTorch",
              "slug": "gpu-small-pytorch",
              "description": "16 CPU cores, 48 GB RAM, 10 GB VRAM via MPS sharing, PyTorch, 10 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 16,
                  "cpu_guarantee": 4,
                  "mem_limit": "48G",
                  "mem_guarantee": "8G",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-pytorch-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive",
                  "extra_annotations": {"gpu-memory": "10240"},
                  "environment": {
                      "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT": "0=10240M",
                      "CUDA_MPS_PIPE_DIRECTORY": "/mps/nvidia.com/gpu/pipe",
                      "CUDA_MPS_LOG_DIRECTORY": "/mps/nvidia.com/gpu/log"
                  },
                  "volumes": _mps_volumes,
                  "volume_mounts": _mps_volume_mounts
              }
          },
          {
              "display_name": "GPU Small - TensorFlow",
              "slug": "gpu-small-tf",
              "description": "16 CPU cores, 48 GB RAM, 10 GB VRAM via MPS sharing, TensorFlow, 10 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 16,
                  "cpu_guarantee": 4,
                  "mem_limit": "48G",
                  "mem_guarantee": "8G",
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-tf-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive",
                  "extra_annotations": {"gpu-memory": "10240"},
                  "environment": {
                      "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT": "0=10240M",
                      "CUDA_MPS_PIPE_DIRECTORY": "/mps/nvidia.com/gpu/pipe",
                      "CUDA_MPS_LOG_DIRECTORY": "/mps/nvidia.com/gpu/log"
                  },
                  "volumes": _mps_volumes,
                  "volume_mounts": _mps_volume_mounts
              }
          },
          {
              "display_name": "GPU Large - PyTorch",
              "slug": "gpu-large-pytorch",
              "description": "24 CPU cores, 96 GB RAM, 1x full A100 GPU (exclusive), PyTorch, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 24,
                  "cpu_guarantee": 6,
                  "mem_limit": "96G",
                  "mem_guarantee": "16G",
                  "extra_resource_limits": {"nvidia.com/gpu": 1},
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-pytorch-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
          {
              "display_name": "GPU Large - TensorFlow",
              "slug": "gpu-large-tf",
              "description": "24 CPU cores, 96 GB RAM, 1x full A100 GPU (exclusive), TensorFlow, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 24,
                  "cpu_guarantee": 6,
                  "mem_limit": "96G",
                  "mem_guarantee": "16G",
                  "extra_resource_limits": {"nvidia.com/gpu": 1},
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-tf-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
          {
              "display_name": "GPU XLarge - PyTorch",
              "slug": "gpu-xlarge-pytorch",
              "description": "48 CPU cores, 128 GB RAM, 2x full A100 GPUs (exclusive, NVLink/PCIe P2P), PyTorch, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 48,
                  "cpu_guarantee": 12,
                  "mem_limit": "128G",
                  "mem_guarantee": "24G",
                  "extra_resource_limits": {"nvidia.com/gpu": 2},
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-pytorch-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
          {
              "display_name": "GPU XLarge - TensorFlow",
              "slug": "gpu-xlarge-tf",
              "description": "48 CPU cores, 128 GB RAM, 2x full A100 GPUs (exclusive, NVLink/PCIe P2P), TensorFlow, 100 GB storage",
              "kubespawner_override": {
                  "cpu_limit": 48,
                  "cpu_guarantee": 12,
                  "mem_limit": "128G",
                  "mem_guarantee": "24G",
                  "extra_resource_limits": {"nvidia.com/gpu": 2},
                  "image": "ghcr.io/mul-cps/cit-jupyter-notebook:latest-tf-code",
                  "scheduler_name": "kai-scheduler",
                  "extra_labels": {"kai.scheduler/queue": "phd-interactive"},
                  "priority_class_name": "kai-phd-interactive"
              }
          },
      ]
      
      async def profile_list_hook(spawner):
          """
          Filter available profiles based on user group membership.
          
          Groups:
          - jhub-admins: See all profiles
          - jhub-powerusers: See all profiles
          - jhub-students: See only cpu-small and gpu-xsmall profiles
          - Others: Default to student-level access (cpu-small, gpu-xsmall)
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))
          
          # Define full access groups
          full_access_groups = {"jhub-admins", "jhub-powerusers"}
          
          # Define student-accessible profile slugs
          student_profiles = {"cpu-small", "gpu-xsmall-pytorch", "gpu-xsmall-tf"}
          
          # Check if user has full access
          has_full_access = bool(groups & full_access_groups)
          
          if has_full_access:
              # Admins and powerusers see all profiles
              spawner.log.info(f"User {spawner.user.name} has full profile access (groups: {groups})")
              return _original_profile_list
          else:
              # Students and others see only limited profiles
              filtered_profiles = [
                  profile for profile in _original_profile_list
                  if profile.get("slug") in student_profiles
              ]
              spawner.log.info(f"User {spawner.user.name} has limited profile access (groups: {groups}), showing: {[p.get('slug') for p in filtered_profiles]}")
              return filtered_profiles
      
      c.KubeSpawner.profile_list = profile_list_hook
  
  # Environment variables from secrets
  extraEnv:
    # PostgreSQL password for hub database
    PGPASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-postgres-credentials
          key: password
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oauth-secret
          key: client-secret

# =============================================================================
# PROXY CONFIGURATION
# =============================================================================

proxy:
  service:
    type: ClusterIP
  
  chp:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# =============================================================================
# SINGLE USER (STUDENT) PODS
# =============================================================================

singleuser:
  # Default notebook image
  image:
    name: ghcr.io/mul-cps/cit-jupyter-notebook
    tag: "latest-standard-cpu"
  
  # Resource limits per user
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G
  
  # Storage - per-user home directory
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: "longhorn"  # Use longhorn
    homeMountPath: /home/jovyan
    # Ephemeral temp storage - fast, cleared on pod restart
    extraVolumes:
      - name: temp-storage
        emptyDir:
          sizeLimit: 10Gi
    extraVolumeMounts:
      - name: temp-storage
        mountPath: /home/jovyan/temp

  # Allow large browser uploads in the notebook UI.
  extraFiles:
    jupyter-server-config:
      mountPath: /etc/jupyter/jupyter_server_config.py
      stringData: |
        c.ServerApp.max_body_size = 1073741824  # 1 GiB
  
  # Use lifecycle hooks instead of initContainers to create directories
  # postStart runs after container starts, when home volume is already mounted
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            # Create base directories
            mkdir -p /home/jovyan/work
            mkdir -p /home/jovyan/temp
            echo "Created base directories: work, temp"
            # Ensure proper ownership (jovyan user: 1000, users group: 100)
            chown -R 1000:100 /home/jovyan/work /home/jovyan/temp 2>/dev/null || true

# =============================================================================
# SCHEDULING
# =============================================================================

scheduling:
  # Disabled 2026-07-06: this chart's built-in user-scheduler is a
  # relabeled kube-scheduler for cloud-autoscaling bin-packing (see
  # https://z2jh.jupyter.org/en/stable/administrator/optimization.html --
  # "Only activate the user scheduler if you have an autoscaling node
  # pool"). Running it alongside kai-scheduler (now set per-profile above
  # via scheduler_name) caused a real incident on the sibling cps-gpu-cluster
  # deployment: a user pod got scheduled by userScheduler instead of
  # kai-scheduler and bypassed KAI's GPU reservation/priority accounting
  # entirely, double-booking a physical GPU. Two independently-active
  # schedulers with overlapping placement targets is a known unstable
  # pattern (same class of bug as jupyterhub/zero-to-jupyterhub-k8s#1592).
  userScheduler:
    enabled: false

  # Pod priority for user pods
  userPods:
    nodeAffinity:
      matchNodePurpose: prefer

# =============================================================================
# CULLING - Idle pod cleanup
# =============================================================================

cull:
  enabled: true
  # Cull after 1 hour of inactivity (aggressive for teaching)
  timeout: 3600
  # Check every 5 minutes
  every: 300
  # Keep user accounts when their servers are culled (only servers are removed)
  users: false
  # Remove named servers after cull
  removeNamedServers: true
  # Max age of a server before culling (8 hours - lecture day)
  maxAge: 28800

# =============================================================================
# INGRESS
# =============================================================================

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - jhub.dshl.unileoben.ac.at
  tls:
    - secretName: dshl-wildcard
      hosts:
        - jhub.dshl.unileoben.ac.at

# =============================================================================
# PRE-PULLER - Reduce spawn time
# =============================================================================

prePuller:
  # Pre-pull images on all nodes
  hook:
    enabled: true
  continuous:
    enabled: true

  # Explicitly pull images used in profileList (since hook hides them from chart)
  extraImages:
    pytorch:
      name: ghcr.io/mul-cps/cit-jupyter-notebook
      tag: "latest-pytorch-code"
    tensorflow:
      name: ghcr.io/mul-cps/cit-jupyter-notebook
      tag: "latest-tf-code"

# =============================================================================
# DEBUG
# =============================================================================

debug:
  enabled: false

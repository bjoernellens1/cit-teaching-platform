# JupyterHub Helm values for CIT Teaching Platform
# Using Zero-to-JupyterHub (z2jh) chart
# Optimized for teaching workloads with course-based access control

# =============================================================================
# HUB CONFIGURATION
# =============================================================================

hub:
  # Standard chart extraFiles; no custom sharing API or permissions.
  extraFiles:
    shared-home:
      mountPath: /usr/local/share/jupyterhub/shared-home-templates/home.html
      stringData: |
        {% extends "templates/home.html" %}
        {% block stylesheet %}
          {{ super() }}
          <style>
            #shared-workspaces { margin-top: 2.5rem; margin-bottom: 2rem; }
            #shared-workspaces .shared-heading { font-size: 1.5rem; margin-bottom: .4rem; }
            #shared-workspaces .shared-status { color: var(--bs-secondary-color); margin-bottom: 1.25rem; }
            #shared-workspaces .shared-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); gap: 1rem; padding: 0; }
            #shared-workspaces .shared-card { height: 100%; border-radius: .75rem; box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .035); }
            #shared-workspaces .shared-card-body { display: flex; align-items: center; gap: 1rem; padding: 1.25rem; }
            #shared-workspaces .shared-copy { flex: 1; min-width: 0; }
            #shared-workspaces .shared-title { font-size: 1.05rem; font-weight: 600; line-height: 1.45; margin: 0 0 .3rem; overflow-wrap: anywhere; }
            #shared-workspaces .shared-subtitle { color: var(--bs-secondary-color); font-size: .875rem; margin: 0; }
            #shared-workspaces .shared-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: .75rem; }
            #shared-workspaces .shared-badge { font-weight: 500; padding: .45em .7em; }
            #shared-workspaces .shared-open { min-width: 5rem; white-space: nowrap; }
            @media (max-width: 575.98px) {
              #shared-workspaces .shared-card-body { align-items: stretch; flex-direction: column; }
              #shared-workspaces .shared-actions { justify-content: space-between; }
            }
          </style>
        {% endblock stylesheet %}
        {% block main %}
          {{ super() }}
          <section id="shared-workspaces" class="container" aria-labelledby="shared-heading">
            <h2 id="shared-heading" class="shared-heading">Shared workspaces</h2>
            <p id="shared-status" class="shared-status" role="status">Loading shared workspaces…</p>
            <ul id="shared-list" class="list-unstyled shared-grid"></ul>
          </section>
        {% endblock main %}
        {% block script %}
          {{ super() }}
          <script>
        (function () {
          "use strict";
          const status = document.getElementById("shared-status");
          const list = document.getElementById("shared-list");
          const current = window.jhdata;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 30000);
          const origin = window.location.origin;
          function safeServerURL(server) {
            if (typeof server.url !== "string" || !server.url.startsWith("/") || server.url.startsWith("//") || /[\\\u0000-\u001f\u007f]/.test(server.url)) return null;
            const url = new URL(server.url, origin);
            const hub = new URL(current.base_url, origin);
            const root = hub.pathname.replace(/hub\/$/, "");
            const expected = root + "user/" + encodeURIComponent(server.user.name) + "/" +
              (server.name ? encodeURIComponent(server.name) + "/" : "");
            if (url.origin !== origin || url.search || url.hash || url.pathname !== expected || server.url !== url.pathname) return null;
            return url.pathname;
          }
          async function load() {
            if (!current || !current.user || !current.xsrf_token) throw Error("Missing current Hub session");
            const endpoint = new URL(current.base_url + "api/users/" + encodeURIComponent(current.user) + "/shared", origin);
            if (endpoint.origin !== origin) throw Error("Invalid Hub origin");
            const records = new Map();
            let offset = 0;
            let limit = 50;
            for (let page = 0; page < 100; page += 1) {
              const url = new URL(endpoint);
              url.searchParams.set("offset", String(offset));
              url.searchParams.set("limit", String(limit));
              const response = await fetch(url.href, {
                method: "GET", credentials: "same-origin", redirect: "error", cache: "no-store",
                headers: {"Accept": "application/jupyterhub-pagination+json", "X-XSRFToken": current.xsrf_token},
                signal: controller.signal
              });
              if (!response.ok) throw Error("Native Hub sharing request failed");
              const body = await response.json();
              if (!body || !Array.isArray(body.items) || !body._pagination) throw Error("Invalid native sharing response");
              for (const share of body.items) {
                const server = share && share.server;
                if (!server || !server.user || typeof server.user.name !== "string" || typeof server.name !== "string" || !Array.isArray(share.scopes)) continue;
                const key = server.user.name + "/" + server.name;
                if (!share.scopes.includes("access:servers!server=" + key)) continue;
                const href = safeServerURL(server);
                const previous = records.get(key) || {owner: server.user.name, name: server.name, groups: new Set(), href: null, canOpen: true};
                if (share.group && typeof share.group.name === "string") previous.groups.add(share.group.name);
                previous.canOpen = previous.canOpen && server.ready === true && Boolean(href);
                previous.href = previous.canOpen ? href : null;
                records.set(key, previous);
              }
              const next = body._pagination.next;
              if (!next) {
                for (const record of records.values()) {
                  const row = document.createElement("li");
                  row.className = "card shared-card";
                  const body = document.createElement("div");
                  body.className = "card-body shared-card-body";
                  const copy = document.createElement("div");
                  copy.className = "shared-copy";
                  const label = document.createElement("h3");
                  label.className = "shared-title";
                  label.textContent = record.groups.size ? Array.from(record.groups).sort().join(", ") : "Shared workspace";
                  copy.appendChild(label);
                  const subtitle = document.createElement("p");
                  subtitle.className = "shared-subtitle";
                  subtitle.textContent = "Shared notebook";
                  copy.appendChild(subtitle);
                  body.appendChild(copy);
                  const actions = document.createElement("div");
                  actions.className = "shared-actions";
                  const state = document.createElement("span");
                  state.className = "badge rounded-pill shared-badge " + (record.href ? "text-success-emphasis bg-success-subtle" : "text-secondary-emphasis bg-secondary-subtle");
                  state.textContent = record.href ? "Running" : "Unavailable";
                  actions.appendChild(state);
                  if (record.href) {
                    const open = document.createElement("a");
                    open.className = "btn btn-primary shared-open";
                    open.textContent = "Open";
                    open.setAttribute("aria-label", "Open shared workspace " + label.textContent);
                    open.href = record.href;
                    actions.appendChild(open);
                  }
                  body.appendChild(actions);
                  row.appendChild(body);
                  list.appendChild(row);
                }
                status.textContent = records.size ? "Workspaces shared with you directly or through your Hub groups." : "No workspaces are currently shared with you.";
                return;
              }
              if (!Number.isSafeInteger(next.offset) || next.offset <= offset || !Number.isSafeInteger(next.limit) || next.limit < 1 || next.limit > 200) throw Error("Invalid native pagination");
              offset = next.offset;
              limit = next.limit;
            }
            throw Error("Native sharing pagination exceeded its bound");
          }
          load().catch(function () {
            list.replaceChildren();
            status.textContent = "Unable to load shared workspaces. Refresh this page to try again.";
          }).finally(function () {
            clearTimeout(timer);
            status.dataset.loaded = "true";
          });
        }());
          </script>
        {% endblock script %}
  # Resource limits for hub
    shared-home-config:
      mountPath: /usr/local/etc/jupyterhub/jupyterhub_config.d/90-shared-home.py
      stringData: |
        # Use the standard chart config.d loader; runtime credentials stay pinned.
        c.JupyterHub.template_paths = ["/usr/local/share/jupyterhub/shared-home-templates"]
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Database configuration - PostgreSQL for 300 users
  # Password provided via PGPASSWORD environment variable in extraEnv
  db:
    type: postgres
    url: "postgresql+psycopg2://jupyterhub@jupyterhub-postgresql:5432/jupyterhub"

  existingSecret: jupyterhub-secrets

  # ==========================================================================
  # AUTHENTICATION - Dex OIDC broker (2026-07-24)
  #
  # Cut over from direct CIT Authentik OIDC to the shared Dex broker
  # (dex.dshl.unileoben.ac.at, deployed in the cps-gpu-cluster repo's
  # system/auth/dex bundle) so CPS and CIT Authentik users can both log in
  # here via one issuer, matching the pattern already validated and merged
  # for the cps-gpu-cluster repo's own JupyterHub instance. Dex's `cps`/
  # `cit` connectors already have insecureEnableGroups: true set (required
  # for GenericOAuthenticator's manage_groups/admin_groups to see any
  # groups at all -- see cps-gpu-cluster docs/dex-idp-broker.md for the
  # full incident writeup) and reuse the SAME preferred_username claim, so
  # username_claim below is UNCHANGED and existing users' claim-<username>
  # PVCs will be reused, not recreated.
  #
  # Rollback: restore the block below to:
  #   authorize_url: https://auth.dshl.unileoben.ac.at/application/o/authorize/
  #   token_url: https://auth.dshl.unileoben.ac.at/application/o/token/
  #   userdata_url: https://auth.dshl.unileoben.ac.at/application/o/userinfo/
  #   client_id: 2iyGeaF0ysvTadhCopxadMp99J65hfxiS79bniI6
  #   login_service: Authentik
  # and restore jupyterhub-oauth-secret's client-secret to the CIT
  # Authentik "Provider for cit-jhub" (pk 2) client secret.
  # ==========================================================================
  config:
    JupyterHub:
      authenticator_class: generic-oauth

    GenericOAuthenticator:
      # Dex broker endpoints (was direct CIT Authentik OIDC)
      authorize_url: https://dex.dshl.unileoben.ac.at/auth
      token_url: https://dex.dshl.unileoben.ac.at/token
      userdata_url: https://dex.dshl.unileoben.ac.at/userinfo

      # OAuth2 client credentials (Dex staticClient "cit-jupyterhub")
      client_id: cit-jupyterhub
      login_service: "Login (CPS or CIT via Dex)"
      # client_secret provided via extraEnv from secret

      # Scopes to request
      scope:
        - openid
        - profile
        - email
        - groups

      # User info mapping
      username_claim: preferred_username

      # Enable auth_state to access groups in spawner
      enable_auth_state: true

      # Enable group management to use admin_groups
      manage_groups: true
      # Admin group mapping
      admin_groups:
        - jhub-admins

      # Allow all authenticated users
      allow_all: true

    Authenticator:
      # Enable auth_state for group-based configuration
      enable_auth_state: true
      # Auto-login (skip JupyterHub login button)
      auto_login: true

  # ==========================================================================
  # EXTRA CONFIGURATION - Pre-spawn hook for course folders
  # ==========================================================================
  extraConfig:
    # Notebook images load several Jupyter extensions before accepting HTTP
    # requests. The Spawner default is 30 seconds, which kills a healthy
    # server during that initialization.
    http_timeout: |
      c.Spawner.http_timeout = 120

    # Pre-spawn hook to create user directories and configure storage
    pre_spawn_hook: |
      import os

      async def pre_spawn_hook(spawner):
          """
          Pre-spawn hook to configure user environment based on group membership.

          Storage layout:
          - /home/jovyan (persistent, per-user Longhorn volume)
          - /home/jovyan/temp (ephemeral, fast emptyDir - cleared on pod restart)
          - /home/jovyan/shared (persistent, Longhorn RWX - only for admins/powerusers)
          - /home/jovyan/courses/<course_id> (persistent, per-course Longhorn RWX)

          Groups:
          - jhub-students: No shared storage, only home + temp + course folders
          - jhub-admins/jhub-powerusers: Full access including global shared folder
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))

          # Groups that get access to shared storage
          privileged_groups = {"jhub-admins", "jhub-powerusers"}
          is_privileged = bool(groups & privileged_groups)

          # Always create work directory (temp is created automatically by emptyDir mount)
          init_dirs = ["/home/jovyan/work"]

          # Conditional mounts are appended to chart-managed storage below.
          volumes = []
          volume_mounts = []

          def append_volume_mount(volume_spec, mount_spec):
              """Append without replacing Z2JH's home and extraFiles mounts."""
              if isinstance(spawner.volumes, dict):
                  spawner.volumes[volume_spec["name"]] = volume_spec
              else:
                  spawner.volumes = list(spawner.volumes or []) + [volume_spec]

              if isinstance(spawner.volume_mounts, dict):
                  spawner.volume_mounts[mount_spec["name"]] = mount_spec
              else:
                  spawner.volume_mounts = list(spawner.volume_mounts or []) + [mount_spec]

          # Only mount shared storage for privileged users (not students)
          if is_privileged:
              init_dirs.append("/home/jovyan/shared")
              volumes.append({
                  "name": "global-shared",
                  "persistentVolumeClaim": {
                      "claimName": "jupyterhub-shared"
                  }
              })
              volume_mounts.append({
                  "name": "global-shared",
                  "mountPath": "/home/jovyan/shared",
                  "readOnly": False
              })
              spawner.log.info(f"User {spawner.user.name} is privileged, mounting shared storage")
          else:
              spawner.log.info(f"User {spawner.user.name} is student, no shared storage")

          # Identify course groups and prepare mounts
          course_ids = []
          for g in groups:
              if g.startswith("course-"):
                  course_id = g.replace("course-", "")
                  course_ids.append(course_id)

                  # Add user-local course directory
                  init_dirs.append(f"/home/jovyan/courses/{course_id}")

                  # Mount shared course volume (if exists)
                  volumes.append({
                      "name": f"course-{course_id}-shared",
                      "persistentVolumeClaim": {
                          "claimName": f"course-{course_id}-shared"
                      }
                  })
                  volume_mounts.append({
                      "name": f"course-{course_id}-shared",
                      "mountPath": f"/srv/courses/{course_id}",
                      "readOnly": False
                  })

          # Set environment for postStart hook
          spawner.environment["INIT_DIRS"] = " ".join(init_dirs)

          for volume_spec, mount_spec in zip(volumes, volume_mounts):
              append_volume_mount(volume_spec, mount_spec)

          spawner.log.info(f"Preserved base storage and added conditional volumes: {[v.get('name') for v in volumes]}")

          # Log for debugging
          spawner.log.info(f"User {spawner.user.name} groups: {groups}, courses: {course_ids}, privileged: {is_privileged}")

      c.KubeSpawner.pre_spawn_hook = pre_spawn_hook

    # Profile list hook for group-based profile filtering
    profile_list_hook: |
      # Z2JH constructs these traits as dictionaries. KubeSpawner merges a
      # dictionary profile override by key, preserving the dynamic home PVC,
      # temp volume, and extraFiles-mounted Xpra configuration.
      _mps_volumes = {
          "mps-pipe": {"name": "mps-pipe", "hostPath": {"path": "/run/nvidia/mps/nvidia.com/gpu/pipe", "type": "DirectoryOrCreate"}},
          "mps-log": {"name": "mps-log", "hostPath": {"path": "/run/nvidia/mps/nvidia.com/gpu/log", "type": "DirectoryOrCreate"}},
      }
      _mps_volume_mounts = {
          "mps-pipe": {"name": "mps-pipe", "mountPath": "/mps/nvidia.com/gpu/pipe"},
          "mps-log": {"name": "mps-log", "mountPath": "/mps/nvidia.com/gpu/log"},
      }

      _mujoco_gpu_memory_choices = {
          str(gib): {
              "display_name": f"{gib} GiB",
              "default": gib == 1,
              "kubespawner_override": {
                  "extra_annotations": {"gpu-memory": str(gib * 1024)},
                  "environment": {
                      "CUDA_MPS_PINNED_DEVICE_MEM_LIMIT": f"0={gib * 1024}M",
                      "CUDA_MPS_PIPE_DIRECTORY": "/mps/nvidia.com/gpu/pipe",
                      "CUDA_MPS_LOG_DIRECTORY": "/mps/nvidia.com/gpu/log",
                  },
                  "volumes": _mps_volumes,
                  "volume_mounts": _mps_volume_mounts,
              },
          }
          for gib in range(1, 21)
      }
      _mujoco_session_duration_choices = {
          str(hours): {
              "display_name": f"{hours} hours" + (" (training)" if hours >= 8 else ""),
              "default": hours == 2,
              "kubespawner_override": {"active_deadline_seconds": hours * 3600},
          }
          for hours in (2, 4, 8, 24)
      }

      # Store the original profile list before overwriting with the hook
      _original_profile_list = [
          {

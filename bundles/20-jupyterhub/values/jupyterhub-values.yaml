# JupyterHub Helm values for CIT Teaching Platform
# Using Zero-to-JupyterHub (z2jh) chart
# Optimized for teaching workloads with course-based access control

# =============================================================================
# HUB CONFIGURATION
# =============================================================================

hub:
  # Resource limits for hub
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  # Database configuration
  db:
    type: sqlite-pvc
    pvc:
      storageClassName: "longhorn"  # Use longhorn
      storage: 1Gi
  
  existingSecret: jupyterhub-secrets
  
  # ==========================================================================
  # AUTHENTICATION - Authentik OIDC
  # ==========================================================================
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    
    GenericOAuthenticator:
      # Authentik OIDC endpoints
      authorize_url: https://auth.dshl.unileoben.ac.at/application/o/authorize/
      token_url: https://auth.dshl.unileoben.ac.at/application/o/token/
      userdata_url: https://auth.dshl.unileoben.ac.at/application/o/userinfo/
      
      # OAuth2 client credentials (from Authentik)
      client_id: LZwSaXX9KYbMWUhdlwGbvbREWYKK55DXYYzSJoo0
      login_service: Authentik
      # client_secret provided via extraEnv from secret
      
      # Scopes to request
      scope:
        - openid
        - profile
        - email
        - groups
      
      # User info mapping
      username_claim: preferred_username
      
      # Enable auth_state to access groups in spawner
      enable_auth_state: true
      
      # Enable group management to use admin_groups
      manage_groups: true
      # Admin group mapping
      admin_groups:
        - jhub-admins
      
      # Allow all authenticated users
      allow_all: true
    
    Authenticator:
      # Enable auth_state for group-based configuration
      enable_auth_state: true
      # Auto-login (skip JupyterHub login button)
      auto_login: true
  
  # ==========================================================================
  # EXTRA CONFIGURATION - Pre-spawn hook for course folders
  # ==========================================================================
  extraConfig:
    # Pre-spawn hook to create user directories and mount course volumes
    pre_spawn_hook: |
      import os
      
      async def pre_spawn_hook(spawner):
          """
          Pre-spawn hook to configure user environment based on group membership.
          
          This hook:
          1. Creates user-local directories (work, shared, courses/*)
          2. Mounts shared course volumes based on group membership
          3. Sets environment variables for the init container
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))
          
          # Always create these user-local folders
          init_dirs = ["/home/jovyan/work", "/home/jovyan/shared"]
          
          # Identify course groups and prepare mounts
          course_ids = []
          volume_mounts = []
          volumes = []
          
          for g in groups:
              if g.startswith("course-"):
                  course_id = g.replace("course-", "")
                  course_ids.append(course_id)
                  
                  # Add user-local course directory
                  init_dirs.append(f"/home/jovyan/courses/{course_id}")
                  
                  # Mount shared course volume (if exists)
                  volumes.append({
                      "name": f"course-{course_id}-shared",
                      "persistentVolumeClaim": {
                          "claimName": f"course-{course_id}-shared"
                      }
                  })
                  volume_mounts.append({
                      "name": f"course-{course_id}-shared",
                      "mountPath": f"/srv/courses/{course_id}",
                      "readOnly": False
                  })
          
          # Set environment for init container
          spawner.environment["INIT_DIRS"] = " ".join(init_dirs)
          
          # Add course volumes (safely initialize lists if not present)
          if volumes:
              spawner.volumes = getattr(spawner, 'volumes', []) or []
              spawner.volume_mounts = getattr(spawner, 'volume_mounts', []) or []
              spawner.volumes.extend(volumes)
              spawner.volume_mounts.extend(volume_mounts)
          
          # Log for debugging
          spawner.log.info(f"User {spawner.user.name} groups: {groups}, courses: {course_ids}")
      
      c.KubeSpawner.pre_spawn_hook = pre_spawn_hook
    
    # Profile list hook for group-based profile filtering
    profile_list_hook: |
      async def profile_list_hook(spawner):
          """
          Filter available profiles based on user group membership.
          
          Groups:
          - jhub-admins: See all profiles
          - jhub-powerusers: See all profiles
          - jhub-students: See only cpu-small and gpu-small profiles
          - Others: Default to student-level access (cpu-small, gpu-small)
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))
          
          # Define full access groups
          full_access_groups = {"jhub-admins", "jhub-powerusers"}
          
          # Define student-accessible profile slugs
          student_profiles = {"cpu-small", "gpu-small"}
          
          # Check if user has full access
          has_full_access = bool(groups & full_access_groups)
          
          # Get all profiles from spawner
          all_profiles = spawner.profile_list.copy()
          
          if has_full_access:
              # Admins and powerusers see all profiles
              spawner.log.info(f"User {spawner.user.name} has full profile access (groups: {groups})")
              return all_profiles
          else:
              # Students and others see only limited profiles
              filtered_profiles = [
                  profile for profile in all_profiles
                  if profile.get("slug") in student_profiles
              ]
              spawner.log.info(f"User {spawner.user.name} has limited profile access (groups: {groups}), showing: {[p.get('slug') for p in filtered_profiles]}")
              return filtered_profiles
      
      c.KubeSpawner.profile_list = profile_list_hook
  
  # Environment variables from secrets
  extraEnv:
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oauth-secret
          key: client-secret

# =============================================================================
# PROXY CONFIGURATION
# =============================================================================

proxy:
  service:
    type: ClusterIP
  
  chp:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# =============================================================================
# SINGLE USER (STUDENT) PODS
# =============================================================================

singleuser:
  # Default notebook image
  image:
    name: quay.io/jupyter/datascience-notebook
    tag: "2026-02-02"
  
  # Resource limits per user
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G
  
  # Storage - per-user home directory
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: "longhorn"  # Use longhorn
    homeMountPath: /home/jovyan
    extraVolumes: []
    extraVolumeMounts: []
  
  # Init container to create directories
  initContainers:
    - name: init-directories
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          # Create directories from INIT_DIRS environment variable
          if [ -n "$INIT_DIRS" ]; then
            for dir in $INIT_DIRS; do
              mkdir -p "$dir"
              echo "Created directory: $dir"
            done
          fi
          # Ensure proper ownership
          chown -R 1000:100 /home/jovyan
      env:
        - name: INIT_DIRS
          value: "/home/jovyan/work /home/jovyan/shared"
      volumeMounts:
        - name: volume-{username}
          mountPath: /home/jovyan
  
  # Profile list for different resource tiers
  # Note: Profile visibility is controlled by the profile_list hook in hub.extraConfig
  profileList:
    # CPU Profiles
    - display_name: "CPU Small"
      slug: "cpu-small"
      description: "2 CPU cores, 6 GB RAM, 10 GB storage"
      default: true
      kubespawner_override:
        cpu_limit: 2
        cpu_guarantee: 0.5
        mem_limit: "6G"
        mem_guarantee: "1G"
        storage_capacity: "10Gi"
    
    - display_name: "CPU Large"
      slug: "cpu-large"
      description: "12 CPU cores, 24 GB RAM, 100 GB storage"
      kubespawner_override:
        cpu_limit: 12
        cpu_guarantee: 2
        mem_limit: "24G"
        mem_guarantee: "4G"
        storage_capacity: "100Gi"
    
    - display_name: "CPU XLarge"
      slug: "cpu-xlarge"
      description: "48 CPU cores, 128 GB RAM, 100 GB storage"
      kubespawner_override:
        cpu_limit: 48
        cpu_guarantee: 8
        mem_limit: "128G"
        mem_guarantee: "16G"
        storage_capacity: "100Gi"
    
    # GPU Profiles
    - display_name: "GPU XSmall"
      slug: "gpu-xsmall"
      description: "8 CPU cores, 24 GB RAM, 5 GB VRAM (A100 MIG slice), 10 GB storage"
      kubespawner_override:
        cpu_limit: 8
        cpu_guarantee: 2
        mem_limit: "24G"
        mem_guarantee: "4G"
        storage_capacity: "10Gi"
        extra_resource_limits:
          nvidia.com/mig-1g.5gb: 1
    
    - display_name: "GPU Small"
      slug: "gpu-small"
      description: "16 CPU cores, 48 GB RAM, 10 GB VRAM (A100 MIG slice), 10 GB storage"
      kubespawner_override:
        cpu_limit: 16
        cpu_guarantee: 4
        mem_limit: "48G"
        mem_guarantee: "8G"
        storage_capacity: "10Gi"
        extra_resource_limits:
          nvidia.com/mig-2g.10gb: 1
    
    - display_name: "GPU Large"
      slug: "gpu-large"
      description: "24 CPU cores, 96 GB RAM, 1x full A100 GPU, 100 GB storage"
      kubespawner_override:
        cpu_limit: 24
        cpu_guarantee: 6
        mem_limit: "96G"
        mem_guarantee: "16G"
        storage_capacity: "100Gi"
        extra_resource_limits:
          nvidia.com/gpu: 1
    
    - display_name: "GPU XLarge"
      slug: "gpu-xlarge"
      description: "48 CPU cores, 128 GB RAM, 2x full A100 GPUs, 100 GB storage"
      kubespawner_override:
        cpu_limit: 48
        cpu_guarantee: 12
        mem_limit: "128G"
        mem_guarantee: "24G"
        storage_capacity: "100Gi"
        extra_resource_limits:
          nvidia.com/gpu: 2

# =============================================================================
# SCHEDULING
# =============================================================================

scheduling:
  # User scheduler for better pod placement
  userScheduler:
    enabled: true
  
  # Pod priority for user pods
  userPods:
    nodeAffinity:
      matchNodePurpose: prefer

# =============================================================================
# CULLING - Idle pod cleanup
# =============================================================================

cull:
  enabled: true
  # Cull after 1 hour of inactivity (aggressive for teaching)
  timeout: 3600
  # Check every 5 minutes
  every: 300
  # Keep user accounts when their servers are culled (only servers are removed)
  users: false
  # Remove named servers after cull
  removeNamedServers: true
  # Max age of a server before culling (8 hours - lecture day)
  maxAge: 28800

# =============================================================================
# INGRESS
# =============================================================================

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - jhub.dshl.unileoben.ac.at
  tls:
    - secretName: dshl-wildcard
      hosts:
        - jhub.dshl.unileoben.ac.at

# =============================================================================
# PRE-PULLER - Reduce spawn time
# =============================================================================

prePuller:
  # Pre-pull images on all nodes
  hook:
    enabled: true
  continuous:
    enabled: true

# =============================================================================
# DEBUG
# =============================================================================

debug:
  enabled: false

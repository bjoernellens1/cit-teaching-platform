      async def profile_list_hook(spawner):
          """
          Filter available profiles based on user group membership.

          Groups:
          - jhub-admins: See all profiles
          - jhub-powerusers: See all profiles
          - jhub-students: See only cpu-small and gpu-xsmall profiles
          - Others: Default to student-level access (cpu-small, gpu-xsmall)
          """
          auth_state = await spawner.user.get_auth_state()
          groups = set((auth_state or {}).get("oauth_user", {}).get("groups", []))

          # Define full access groups
          full_access_groups = {"jhub-admins", "jhub-powerusers"}

          # Define student-accessible profile slugs
          student_profiles = {"cpu-small", "gpu-xsmall-pytorch", "gpu-xsmall-tf", "gpu-mujoco-xpra"}

          # Check if user has full access
          has_full_access = bool(groups & full_access_groups)

          if has_full_access:
              # Admins and powerusers see all profiles
              spawner.log.info(f"User {spawner.user.name} has full profile access (groups: {groups})")
              return _original_profile_list
          else:
              # Students and others see only limited profiles
              filtered_profiles = [
                  profile for profile in _original_profile_list
                  if profile.get("slug") in student_profiles
              ]
              spawner.log.info(f"User {spawner.user.name} has limited profile access (groups: {groups}), showing: {[p.get('slug') for p in filtered_profiles]}")
              return filtered_profiles

      c.KubeSpawner.profile_list = profile_list_hook

  # Environment variables from secrets
  extraEnv:
    # PostgreSQL password for hub database
    PGPASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-postgres-credentials
          key: password
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oauth-secret
          key: client-secret

# =============================================================================
# PROXY CONFIGURATION
# =============================================================================

proxy:
  service:
    type: ClusterIP

  chp:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# =============================================================================
# SINGLE USER (STUDENT) PODS
# =============================================================================

singleuser:
  # Default notebook image
  image:
    name: ghcr.io/mul-cps/cit-jupyter-notebook
    tag: "latest-standard-cpu"
    pullSecrets:
      - name: harbor-cps-users-pull

  # Resource limits per user
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G

  # Storage - per-user home directory
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: "longhorn"  # Use longhorn
    homeMountPath: /home/jovyan
    # Ephemeral temp storage - fast, cleared on pod restart
    extraVolumes:
      - name: temp-storage
        emptyDir:
          sizeLimit: 10Gi
    extraVolumeMounts:
      - name: temp-storage
        mountPath: /home/jovyan/temp

  # Allow large browser uploads in the notebook UI.
  extraFiles:
    jupyter-server-config:
      mountPath: /usr/local/etc/jupyter/jupyter_server_config.py
      stringData: |
        c.ServerApp.max_body_size = 1073741824  # 1 GiB

        # Xpra's bundled Xvfb crashes with the NVIDIA EGL stack. This system
        # Xvfb command is the known-good CPS GPU cluster configuration.
        def _xpra_command(port):
            return [
                "xpra", "start", ":100", f"--bind-tcp=127.0.0.1:{port}",
                "--html=on", "--daemon=no", "--exit-with-children=yes",
                "--start-child=/usr/local/bin/start-xpra-desktop.sh",
                "--systemd-run=no", "--pulseaudio=no",
                "--file-transfer=yes", "--file-size-limit=1G", "--open-files=no",
                "--clipboard=yes", "--notifications=yes", "--system-tray=yes",
                "--xvfb=Xvfb -screen 0 1680x1050x24 -extension GLX "
                "+extension RANDR +extension RENDER +extension Composite "
                "-nolisten tcp -noreset -dpi 96 -auth $XAUTHORITY",
                "--dpi=96",
            ]

        c.ServerProxy.servers = {
          "xpra": {
            "command": _xpra_command,
            "timeout": 60,
            "launcher_entry": {"title": "Desktop (Xpra)"},
          },
        }

  # Use lifecycle hooks instead of initContainers to create directories
  # postStart runs after container starts, when home volume is already mounted
  lifecycleHooks:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            # Create base directories
            mkdir -p /home/jovyan/work
            mkdir -p /home/jovyan/temp
            echo "Created base directories: work, temp"
            # Ensure proper ownership (jovyan user: 1000, users group: 100)
            chown -R 1000:100 /home/jovyan/work /home/jovyan/temp 2>/dev/null || true

# =============================================================================
# SCHEDULING
# =============================================================================

scheduling:
  # Disabled 2026-07-06: this chart's built-in user-scheduler is a
  # relabeled kube-scheduler for cloud-autoscaling bin-packing (see
  # https://z2jh.jupyter.org/en/stable/administrator/optimization.html --
  # "Only activate the user scheduler if you have an autoscaling node
  # pool"). Running it alongside kai-scheduler (now set per-profile above
  # via scheduler_name) caused a real incident on the sibling cps-gpu-cluster
  # deployment: a user pod got scheduled by userScheduler instead of
  # kai-scheduler and bypassed KAI's GPU reservation/priority accounting
  # entirely, double-booking a physical GPU. Two independently-active
  # schedulers with overlapping placement targets is a known unstable
  # pattern (same class of bug as jupyterhub/zero-to-jupyterhub-k8s#1592).
  userScheduler:
    enabled: false

  # Pod priority for user pods
  userPods:
    nodeAffinity:
      matchNodePurpose: prefer

# =============================================================================
# CULLING - Idle pod cleanup
# =============================================================================

cull:
  enabled: true
  # Detached MuJoCo training is bounded by its selected pod deadline.
  # Keep it alive when the browser/kernel reports no activity.
  # Cull after 24 hours of inactivity.
  timeout: 86400
  # Check every 5 minutes
  every: 300
  # Keep user accounts when their servers are culled (only servers are removed)
  users: false
  # Remove named servers after cull
  removeNamedServers: true
  # Per-profile activeDeadlineSeconds enforces the 2-24 hour session limit.
  maxAge: 86400

# =============================================================================
# INGRESS
# =============================================================================

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - jhub.dshl.unileoben.ac.at
  tls:
    - secretName: dshl-wildcard
      hosts:
        - jhub.dshl.unileoben.ac.at

# =============================================================================
# PRE-PULLER - Reduce spawn time
# =============================================================================

prePuller:
  # Pre-pull images on all nodes
  hook:
    enabled: true
  continuous:
    enabled: true

  # Explicitly pull images used in profileList (since hook hides them from chart)
  extraImages:
    pytorch:
      name: ghcr.io/mul-cps/cit-jupyter-notebook
      tag: "latest-pytorch-code"
    tensorflow:
      name: ghcr.io/mul-cps/cit-jupyter-notebook
      tag: "latest-tf-code"

# =============================================================================
# DEBUG
# =============================================================================

debug:
  enabled: false

# Fleet bundle configuration for JupyterHub
# Bundle name: cit-jupyterhub
name: cit-jupyterhub

defaultNamespace: cit-jhub

helm:
  repo: https://hub.jupyter.org/helm-chart/
  chart: jupyterhub
  version: 4.3.2
  releaseName: cit-jupyterhub
  valuesFiles:
    - values/jupyterhub-values.yaml

# Depends on Authentik for OIDC and SOPS operator for secret decryption
# Include SopsSecret manifest for encrypted secrets
resources:
  - path: jupyterhub-sopssecret.yaml

dependsOn:
  - name: cit-authentik
  - name: cit-sops-operator

# Target cluster selection
targets:
  - name: cit-clusters
    clusterSelector:
      matchLabels:
        env: cit-teaching

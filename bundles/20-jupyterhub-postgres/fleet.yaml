# Fleet bundle for JupyterHub PostgreSQL
name: cit-jupyterhub-postgres
defaultNamespace: cit-jhub

# Depends on secrets bundle to ensure credentials exist
dependsOn:
  - name: cit-jupyterhub-secrets

# Target cluster selection
targets:
  - name: cit-clusters
    clusterSelector:
      matchLabels:
        env: cit-teaching

helm:
  # Install PostgreSQL from Bitnami chart
  repo: https://charts.bitnami.com/bitnami
  chart: postgresql
  version: 16.2.5
  releaseName: jupyterhub-postgresql
  values:
    # Use postgresql 16 explicitly
    image:
      tag: latest
    fullnameOverride: "jupyterhub-postgresql"
    global:
      postgresql:
        auth:
          password: "placeholder-for-helm-validation"
          existingSecret: jupyterhub-postgres-credentials
          secretKeys:
            adminPasswordKey: postgres-password
            userPasswordKey: password
    auth:
      username: jupyterhub
      database: jupyterhub
      password: "placeholder-for-helm-validation"
      existingSecret: jupyterhub-postgres-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 1Gi
      persistence:
        enabled: true
        size: 5Gi
        storageClass: longhorn
      service:
        type: ClusterIP
        ports:
          postgresql: 5432
      # Ensure it runs as non-root (default in bitnami)
      podSecurityContext:
        fsGroup: 999
        enabled: true
      containerSecurityContext:
        runAsUser: 999
        enabled: true
